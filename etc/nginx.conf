worker_processes  auto;

events {
    worker_connections  1024;
}

# must match daemondo's --pidfile specification
pid @PREFIX@/var/run/nginx/nginx-pki.pid;

http {
    include       @PREFIX@/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Apache's ServerTokens Prod / ServerSignature Off equivalent
    server_tokens off;

    log_format vhost '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" $host';

    # Apache's RequestReadTimeout equivalent
    client_header_timeout 20s;
    client_body_timeout   20s;
    send_timeout          20s;

    keepalive_timeout 65;

    # extra MIME types for CRL/cert files, since nginx's default
    # mime.types doesn't know about these
    types {
        application/pkix-crl     crl;
        application/x-pem-file   pem;
        application/pkix-cert    crt cer;
    }

    # ---------------------------------------------------------------
    # Default catch-all: any request with no matching server_name
    # (bare IP hits, scanners, bad Host headers) lands here and is
    # denied - nginx's default_server does this natively, unlike
    # Apache where load order determined the fallback.
    # ---------------------------------------------------------------
    server {
        listen       80 default_server;
        server_name  _;
        return       403;
        access_log   off;
        error_log    @PREFIX@/var/log/nginx/pki_default_deny-error.log;
    }

    # ---------------------------------------------------------------
    # pki.myorganization.org - public CRL/cert distribution
    # ---------------------------------------------------------------
    server {
        listen       80;
        server_name  pki.myorganization.org;
        root         @PREFIX@/var/www/pki.myorganization.org;

        access_log   @PREFIX@/var/log/nginx/pki_myorganization_org-access.log vhost;
        error_log    @PREFIX@/var/log/nginx/pki_myorganization_org-error.log;

        # only GET/HEAD - static file drop, nothing else
        limit_except GET HEAD {
            deny all;
        }

        # only serve the specific revocation/cert file types
        location / {
            location ~* \.(crl|pem|crt|cer)$ {
                try_files $uri =404;
            }
            return 404;
        }

        # belt-and-suspenders: never list directories, never follow
        # symlinks out of the docroot
        autoindex off;
        disable_symlinks on;
    }

    # ---------------------------------------------------------------
    # proxy.myorganization.private - LAN/VPN only, serves proxy.pac
    # ---------------------------------------------------------------
    server {
        listen       80;
        server_name  proxy.myorganization.private;
        root         @PREFIX@/var/www/proxy.myorganization.private;
        index        index.html;

        access_log   @PREFIX@/var/log/nginx/proxy_myorganization_private-access.log vhost;
        error_log    @PREFIX@/var/log/nginx/proxy_myorganization_private-error.log;

        # Local + LAN + VPN only - must never be reachable from the internet
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 10.2.0.0/24;           # VPN clients
        allow fd00:dead:beef::/64;   # VPN clients (IPv6 pool)
        deny  all;

        autoindex off;
        # Apache's -FollowSymLinks: disable_symlinks avoids nginx
        # serving outside the docroot via a symlink
        disable_symlinks on;

        # Only these two names are servable - everything else 404s
        location / {
            location ~* ^/(index\.html|proxy[^/]*\.pac)$ {
                try_files $uri =404;
            }
            return 404;
        }
    }
}
